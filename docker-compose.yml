version: '3.8'

# ==============================================================================
# AtmoGraph Multi-Service Production Stack Orchestration
# Services:
#   1. neo4j: Graph Database for Supply Chain Nodes, Routes, and Echelons
#   2. backend: FastAPI REST Engine, NLP Ingestion & GNN Ripple Predictor
#   3. frontend: Nginx Reverse Proxy & React Flow Interactive Dashboard
# ==============================================================================

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: atmograph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser & Discovery
      - "7687:7687"   # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=neo4j/atmograph2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - atmograph-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atmograph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ATMOGRAPH_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=atmograph2026
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://frontend:80
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - atmograph-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: atmograph-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atmograph-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  atmograph-net:
    driver: bridge
    name: atmograph-network

volumes:
  neo4j_data:
    name: atmograph_neo4j_data
  neo4j_logs:
    name: atmograph_neo4j_logs
