[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src .
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --show-capture=no
markers =
    unit: Unit tests with zero external dependencies
    integration: Integration tests between services and mock adapters
    api: REST API endpoint tests
    websocket: Real-time WebSocket streaming tests
    slow: Tests that take more than 1 second to execute
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
