version: '3.8'

# ==============================================================================
# AtmoGraph Docker Compose Override: Local Development & Debugging Profile
# Automatically merged with docker-compose.yml by `docker compose up`
# ==============================================================================

services:
  backend:
    environment:
      - ATMOGRAPH_ENV=development
      - DEBUG=true
      - RELOAD=true
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/alerts
